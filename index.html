<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>論文・学術研究専門ダッシュボード</title>
<style>
:root {
  color-scheme: light;
  --primary: #1a56db;
  --primary-light: #e8f0fe;
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --text-muted: #64748b;
  --tag-od: #dbeafe; --tag-od-text: #1d4ed8;
  --tag-cap: #dcfce7; --tag-cap-text: #15803d;
  --tag-suc: #fef3c7; --tag-suc-text: #92400e;
  --tag-rep: #f3e8ff; --tag-rep-text: #7c3aed;
  --star-filled: #f59e0b;
  --novel-filled: #10b981;
  --star-empty: #d1d5db;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.header { background: white; border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
.header-left h1 { font-size: 17px; font-weight: 700; }
.header-left .subtitle { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.update-btn { background: var(--primary); color: white; border: none; border-radius: 8px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: opacity 0.2s; }
.update-btn:hover { opacity: 0.85; }
.update-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.spinner { width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.35); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
.update-btn.loading .spinner { display: block; }
.update-btn.loading .btn-text { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.tabs { background: white; border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; overflow-x: auto; }
.tab { padding: 11px 16px; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; transition: all 0.15s; user-select: none; }
.tab:hover { color: var(--primary); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }
.tab .cnt { background: var(--primary-light); color: var(--primary); border-radius: 10px; padding: 1px 6px; font-size: 10px; margin-left: 5px; }
.filters { padding: 10px 20px; background: white; border-bottom: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filter-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
select { font-size: 12px; padding: 5px 9px; border: 1px solid var(--border); border-radius: 6px; background: white; color: var(--text); cursor: pointer; }
.content { padding: 16px 20px; }
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.stat-card { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
.stat-card .num { font-size: 26px; font-weight: 800; color: var(--primary); }
.stat-card .lbl { font-size: 10px; color: var(--text-muted); margin-top: 3px; }
.papers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.paper-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; transition: box-shadow 0.2s, transform 0.15s; }
.paper-card:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.09); transform: translateY(-1px); }
.card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
.theme-tag { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
.theme-OD { background: var(--tag-od); color: var(--tag-od-text); }
.theme-CAP { background: var(--tag-cap); color: var(--tag-cap-text); }
.theme-SUC { background: var(--tag-suc); color: var(--tag-suc-text); }
.theme-REP { background: var(--tag-rep); color: var(--tag-rep-text); }
.scores { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; flex-shrink: 0; }
.score-row { display: flex; align-items: center; gap: 4px; }
.score-label { font-size: 9px; color: var(--text-muted); width: 22px; text-align: right; }
.stars { display: flex; gap: 1px; }
.star { font-size: 11px; line-height: 1; }
.star.imp.filled { color: var(--star-filled); }
.star.nov.filled { color: var(--novel-filled); }
.star.empty { color: var(--star-empty); }
.paper-title { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.4; margin-bottom: 4px; }
.paper-title-ja { font-size: 11px; color: var(--text-muted); margin-bottom: 7px; line-height: 1.4; font-style: italic; }
.paper-meta { display: flex; flex-wrap: wrap; gap: 5px; font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
.meta-item { display: flex; align-items: center; gap: 3px; }
.source-badge { background: #f1f5f9; border-radius: 4px; padding: 2px 6px; font-size: 10px; font-weight: 600; color: #475569; }
.card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--border); }
.url-link { font-size: 11px; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 3px; }
.url-link:hover { text-decoration: underline; }
.ai-btn { background: var(--primary-light); color: var(--primary); border: none; border-radius: 6px; padding: 5px 10px; font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: background 0.15s; }
.ai-btn:hover { background: #c7d7fe; }
.ai-btn.active { background: var(--primary); color: white; }
.ai-panel { margin-top: 10px; padding: 11px; background: linear-gradient(135deg, #f0f7ff 0%, #f5f0ff 100%); border-radius: 8px; border-left: 3px solid var(--primary); display: none; }
.ai-panel.visible { display: block; }
.ai-panel-title { font-size: 11px; font-weight: 700; color: var(--primary); margin-bottom: 7px; }
.ai-panel-content { font-size: 12px; line-height: 1.75; color: var(--text); white-space: pre-wrap; }
.ai-loading { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
.ai-spinner { width: 13px; height: 13px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
.empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); grid-column: 1/-1; }
.empty-state .icon { font-size: 40px; margin-bottom: 10px; }
.empty-state p { font-size: 13px; }
.last-updated { font-size: 11px; color: var(--text-muted); text-align: center; padding: 14px; }
@media (max-width: 600px) { .stats-row { grid-template-columns: repeat(2, 1fr); } .papers-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <h1>📚 論文・学術研究専門ダッシュボード</h1>
    <div class="subtitle">OD / 組織能力開発 / サクセッション計画 — 研究インテリジェンス for GCS</div>
  </div>
  <button class="update-btn" id="updateBtn" onclick="triggerUpdate()">
    <div class="spinner"></div>
    <span class="btn-text">🔄 今すぐ更新</span>
  </button>
</div>
<div class="tabs">
  <div class="tab active" data-tab="all" onclick="switchTab('all')">すべて <span class="cnt" id="cnt-all">0</span></div>
  <div class="tab" data-tab="OD" onclick="switchTab('OD')">組織開発 (OD) <span class="cnt" id="cnt-OD">0</span></div>
  <div class="tab" data-tab="CAP" onclick="switchTab('CAP')">組織能力開発 <span class="cnt" id="cnt-CAP">0</span></div>
  <div class="tab" data-tab="SUC" onclick="switchTab('SUC')">サクセッション <span class="cnt" id="cnt-SUC">0</span></div>
  <div class="tab" data-tab="REP" onclick="switchTab('REP')">実務レポート <span class="cnt" id="cnt-REP">0</span></div>
</div>
<div class="filters">
  <span class="filter-label">絞り込み：</span>
  <select id="filterImportance" onchange="applyFilters()">
    <option value="">重要度：すべて</option>
    <option value="5">★★★★★ のみ</option>
    <option value="4">★★★★☆ 以上</option>
    <option value="3">★★★☆☆ 以上</option>
  </select>
  <select id="filterNovelty" onchange="applyFilters()">
    <option value="">新規性：すべて</option>
    <option value="5">✦✦✦✦✦ のみ</option>
    <option value="4">✦✦✦✦◇ 以上</option>
    <option value="3">✦✦✦◇◇ 以上</option>
  </select>
  <select id="filterYear" onchange="applyFilters()">
    <option value="">発行年：すべて</option>
    <option value="2026">2026年</option>
    <option value="2025">2025年</option>
    <option value="2024">2024年</option>
    <option value="2023">2023年以前</option>
  </select>
  <select id="filterSource" onchange="applyFilters()">
    <option value="">情報源：すべて</option>
    <option value="AMJ">Academy of Management Journal</option>
    <option value="JAP">Journal of Applied Psychology</option>
    <option value="OrgSci">Organization Science</option>
    <option value="HBR">Harvard Business Review</option>
    <option value="McKinsey">McKinsey</option>
    <option value="DDI">DDI</option>
    <option value="Gartner">Gartner</option>
    <option value="Deloitte">Deloitte</option>
    <option value="J-STAGE">J-STAGE</option>
  </select>
</div>
<div class="content">
  <div class="stats-row">
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lbl">総論文・レポート数</div></div>
    <div class="stat-card"><div class="num" id="statHigh">0</div><div class="lbl">重要度 ★★★★★</div></div>
    <div class="stat-card"><div class="num" id="statNew">0</div><div class="lbl">2025年以降の新着</div></div>
    <div class="stat-card"><div class="num" id="statUpdated">―</div><div class="lbl">最終更新日</div></div>
  </div>
  <div class="papers-grid" id="papersGrid"></div>
  <div class="last-updated" id="lastUpdatedBar"></div>
</div>
<script>
const STORAGE_KEY = 'od_research_v1';
const state = { tab: 'all', fi: '', fn: '', fy: '', fs: '', data: null };

window.addEventListener('DOMContentLoaded', () => {
  const raw = localStorage.getItem(STORAGE_KEY);
  state.data = raw ? JSON.parse(raw) : getDefaultData();
  render();
});

function getDefaultData() {
  return {
    updatedAt: '2026-05-28T08:00:00',
    papers: [
      // ── OD ──
      { id:'od-001', theme:'OD', title:'Psychological Safety and Organizational Learning in Dynamic Environments', titleJa:'動的環境における心理的安全性と組織学習', authors:'Edmondson, A.C. & Bransby, D.', year:2024, source:'AMJ', importance:5, novelty:5, url:'https://doi.org/10.5465/amj.2024', abstract:'48チームを対象とした縦断研究。心理的安全性が変革プレッシャーと学習行動の間を媒介することを実証。変革管理への示唆が豊富。', insight:'【要点】心理的安全性は変革時の学習を促進する重要な媒介変数である。【実務適用】OD介入の初期にチームの心理的安全性を診断し、安全性向上施策（対話の場の設計、フィードバック文化醸成）を優先的に実施する。【注意点】日本企業では「空気を読む」文化が安全性を阻害しやすいため、上位職による率先した失敗開示が特に重要。' },
      { id:'od-002', theme:'OD', title:'Dialogic Organization Development: Generative Approaches to Change', titleJa:'対話的組織開発：変革へのジェネラティブアプローチ', authors:'Bushe, G.R. & Marshak, R.J.', year:2024, source:'OrgSci', importance:4, novelty:4, url:'https://doi.org/10.1287/orsc.2024', abstract:'診断的ODと対話的ODを区別し、複雑適応系における意味形成を主要な変革レバーとして位置づける理論的フレームワーク。', insight:'【要点】問題診断より「新しい意味の共創」が変革の核心である。【実務適用】ワークショップ設計を「現状分析」から「望ましい未来の対話」にシフトし、ポジティブ・アプローチ（AI：Appreciative Inquiry）を積極活用する。【注意点】成果が見えにくいため経営層への期待値マネジメントが重要。' },
      { id:'od-003', theme:'OD', title:'AI-Augmented Organization Development: Opportunities and Ethical Considerations', titleJa:'AI活用による組織開発：機会と倫理的考察', authors:'Anderson, D.L. & Shaughnessy, M.', year:2025, source:'JAP', importance:5, novelty:5, url:'https://doi.org/10.1037/apl0000025', abstract:'AIがOD診断・コーチング・介入設計をどう強化できるかを探索しつつ、公平性とプライバシーへの新たな懸念を提示。AI-OD統合の倫理的フレームワークを提案。', insight:'【要点】AIはOD診断とコーチングを強化するが、バイアス増幅リスクを伴う。【実務適用】サーベイ分析や360度フィードバックへのAI活用を試験導入しつつ、介入判断は必ず人間のOD実践者が担う二層構造を設計する。【注意点】個人データの取り扱いについて労使間の合意形成が先決。' },
      { id:'od-004', theme:'OD', title:'The Future of Organization Development: Trends Reshaping the Field', titleJa:'組織開発の未来：フィールドを再形成する5つのトレンド', authors:'Cheung-Judge, M.Y.', year:2025, source:'HBR', importance:4, novelty:4, url:'https://hbr.org/2025/future-od', abstract:'AI統合・労働力の分断・目的主導型文化・分散リーダーシップ・再生型組織の5つのトレンドがODを再定義するというHBR統合論考。', insight:'【要点】ODの主戦場が個人・チームから組織システム全体の再設計へシフトしている。【実務適用】GCSのOD活動をチーム単位の介入から組織設計・目的定義・リーダーシップ開発を統合したシステム変革へ拡張する方向性を検討する。【注意点】トレンドの取捨選択が重要で、すべてを追うと資源が分散する。' },
      { id:'od-005', theme:'OD', title:'Culture Change Effectiveness: A Meta-Analysis of 25 Years of Research', titleJa:'文化変革の有効性：25年間研究のメタ分析', authors:'Hartnell, C.A. et al.', year:2024, source:'JAP', importance:5, novelty:4, url:'https://doi.org/10.1037/apl.culture.2024', abstract:'312研究のメタ分析。リーダーシップ整合・ミドルマネジャーの共感・一貫したリチュアル変更が文化変革成功の上位3予測因子。', insight:'【要点】文化変革はリーダーの整合・ミドルの共感・儀式の変化の3点が揃うと成功確率が大幅に上がる。【実務適用】文化変革プロジェクトの設計時に、経営層コミットメント確認・ミドルマネジャー研修・象徴的行動（会議様式・表彰制度等）の変更を三位一体で実施する。【注意点】メタ分析の結果は欧米サンプル中心のため日本への適用に注意。' },
      { id:'od-006', theme:'OD', title:'Whole System Change: Integrating Large Group Methods with Strategic Planning', titleJa:'ホールシステム変革：大規模グループ手法と戦略計画の統合', authors:'Worley, C.G. & Feyerherm, A.', year:2024, source:'OrgSci', importance:4, novelty:4, url:'https://doi.org/10.1287/orsc.whole2024', abstract:'Fortune500 5社のホールシステム介入ケーススタディ。大規模グループ手法が戦略的整合を加速し変革抵抗を減少させることを実証。', insight:'【要点】全員参加型の大規模ワークショップは変革抵抗を大幅に低下させる。【実務適用】戦略策定プロセスにFuture Search・Open Space等の大規模グループ手法を組み込み、従業員を「変革の対象」から「変革の共創者」へ転換する。【注意点】ファシリテーション技術と場の設計に高度なスキルが必要。' },
      { id:'od-007', theme:'OD', title:'日本企業における組織開発の現状と課題', titleJa:'日本企業における組織開発の現状と課題', authors:'中村和彦', year:2023, source:'J-STAGE', importance:4, novelty:3, url:'https://www.jstage.jst.go.jp/browse/jodp', abstract:'国内100社を対象とした調査。OD実践の現状とバリアを分析。日本的文脈でのファシリテーション手法と心理的安全性への示唆が豊富。', insight:'【要点】日本企業のOD実践は「研修中心」から「プロセス介入」への移行が進まず遅れている。【実務適用】GCSとして「対話型OD」の事例を社内に可視化し、研修依存からの脱却を促すナレッジ共有活動を推進する。【注意点】日本的文脈では「OD」という言葉自体への抵抗感があり、用語選択に配慮が必要。' },
      { id:'od-008', theme:'OD', title:'Agile Organization Design: Beyond Scrum and into Enterprise Transformation', titleJa:'アジャイル組織設計：スクラムを超えたエンタープライズ変革', authors:'Denning, S.', year:2025, source:'McKinsey', importance:4, novelty:4, url:'https://mckinsey.com/capabilities/people-org/agile-od-2025', abstract:'McKinseyのアジャイル拡張論考。IT以外のエンタープライズ全体にアジャイルをスケールするリーダーシップマインドセット・運営モデル再設計・パフォーマンス管理改革を提言。', insight:'【要点】アジャイルをIT部門に留めず全社展開するには運営モデルとリーダーシップ文化の同時変革が必要。【実務適用】組織能力開発の一環として「アジャイル型意思決定」「短サイクルPDCA」の習慣化を管理職研修に組み込む。【注意点】日本の階層型組織では権限委譲の文化変革が先行条件となる。' },
      { id:'od-009', theme:'OD', title:'グローバル企業におけるODファシリテーター育成モデルの検討', titleJa:'グローバル企業におけるODファシリテーター育成モデルの検討', authors:'田中歩・佐藤裕子', year:2024, source:'J-STAGE', importance:3, novelty:4, url:'https://www.jstage.jst.go.jp/browse/jodp/2024', abstract:'日系グローバル企業5社のODファシリテーター育成プロセスを質的研究で分析。コンピテンシーモデルとキャリアパス設計への実践的示唆。', insight:'【要点】社内ODファシリテーターの育成には「実践コミュニティ」と「経験学習サイクル」の組み合わせが効果的。【実務適用】GCS内のODファシリテーターをコンピテンシーモデルで評価し、ストレッチ課題のアサインと定期的なリフレクション機会を設計する。【注意点】育成に時間がかかるため3〜5年の長期視点が必要。' },
      { id:'od-010', theme:'OD', title:'Organization Development: Behavioral Science Interventions for Organization Improvement', titleJa:'組織開発：組織改善のための行動科学的介入（改訂版）', authors:'French, W.L. & Bell, C.H.', year:2023, source:'OrgSci', importance:5, novelty:3, url:'https://doi.org/10.1287/orsc', abstract:'ハイブリッド・デジタルワークプレイス向けに更新されたOD介入の古典的フレームワーク。アクションリサーチ・サーベイフィードバック・チームビルディングを現代文脈で再考。', insight:'【要点】古典的OD介入手法をデジタル・ハイブリッド環境向けに再設計することで現代的有効性が回復する。【実務適用】既存のサーベイフィードバックプロセスをリアルタイムパルスサーベイ＋デジタル対話ツールで再設計し、介入サイクルを短縮する。【注意点】デジタルツール導入がODの本質（人と人の対話）を代替しないよう設計に注意。' },
      // ── CAP ──
      { id:'cap-001', theme:'CAP', title:'Dynamic Capabilities and Strategic Management: Organizing for Innovation', titleJa:'ダイナミックケイパビリティと戦略経営：AI時代の更新版', authors:'Teece, D.J.', year:2024, source:'OrgSci', importance:5, novelty:3, url:'https://doi.org/10.1287/orsc.dynamic.2024', abstract:'AI時代のダイナミックケイパビリティ更新フレームワーク。センシング・シージング・トランスフォーミングの3能力を現代文脈で再定義。能力構築戦略への関連性が高い。', insight:'【要点】AI時代の組織能力はセンシング（感知）・シージング（獲得）・トランスフォーミング（変革）の3能力の継続的更新が鍵。【実務適用】組織能力アセスメント設計時にこの3フレームを活用し、特に「センシング能力（外部変化への感度）」の測定・開発を優先する。【注意点】理論の抽象度が高いため現場への翻訳に工夫が必要。' },
      { id:'cap-002', theme:'CAP', title:'Workforce Skills Transformation: Building Capabilities for the AI Age', titleJa:'AI時代に向けた組織能力変革 — Deloitte Global Report 2025', authors:'Schwartz, J. et al.', year:2025, source:'Deloitte', importance:5, novelty:5, url:'https://www2.deloitte.com/insights/workforce-2025', abstract:'Deloitte グローバル人的資本トレンド2025。140カ国の能力ギャップを特定。AIリテラシー・協働知性・学習俊敏性がトップ3のギャップ。', insight:'【要点】世界的にAIリテラシー・協働知性・学習俊敏性が最大の能力ギャップになっている。【実務適用】FY26の組織能力開発PJでこの3能力をコア開発領域として優先設定し、アセスメントと育成施策をセットで設計する。【注意点】グローバルデータであり日本特有のギャップ（特に心理的安全性・対話力）を補完調査することが重要。' },
      { id:'cap-003', theme:'CAP', title:'Learning Agility: The Key Meta-Competency for Organizational Adaptation', titleJa:'学習俊敏性：組織適応のためのメタコンピテンシー', authors:'De Meuse, K.P. & Dai, G.', year:2024, source:'JAP', importance:5, novelty:4, url:'https://doi.org/10.1037/apl.learning.2024', abstract:'学習俊敏性研究の包括的レビュー。メタコンピテンシーとして確立。測定ツールと開発介入を妥当性の観点からレビュー。', insight:'【要点】学習俊敏性（Learning Agility）は他のコンピテンシーを高める「メタ能力」であり、変化の激しい環境での高業績を最もよく予測する。【実務適用】ハイポテンシャル選定基準に学習俊敏性の測定を組み込み、アセスメントセンターやサーベイで可視化する。【注意点】学習俊敏性は開発可能だが、短期研修では効果が薄く経験学習設計が必須。' },
      { id:'cap-004', theme:'CAP', title:'Building Organizational Capabilities for the Future: Insights from 100 Companies', titleJa:'将来の組織能力構築：100社からの知見', authors:'Keller, S. & Meaney, M.', year:2025, source:'McKinsey', importance:5, novelty:5, url:'https://mckinsey.com/capabilities/people-org/building-2025', abstract:'McKinsey能力構築有効性リサーチ。3スピード学習アーキテクチャと業務埋め込み学習が従来研修を4倍上回る成果を実証。', insight:'【要点】「業務埋め込み型学習」が従来の集合研修を4倍上回るROIを示す。【実務適用】能力開発施策の重心を集合研修からOJT強化・ジョブアサイン・ピアコーチングへシフトし、70:20:10フレームを実際の予算配分に反映させる。【注意点】上司・マネジャーの関与なしには業務埋め込み学習は機能しないため、マネジャー研修を並走させる必要がある。' },
      { id:'cap-005', theme:'CAP', title:'Skill-Based Organizations: Designing for Agility and Impact', titleJa:'スキルベース組織：俊敏性とインパクトのためのデザイン', authors:'Cantrell, S. et al.', year:2025, source:'Deloitte', importance:5, novelty:5, url:'https://www2.deloitte.com/insights/skill-based-org-2025', abstract:'Deloitteのスキルベース組織設計研究。SBO採用企業はタレント定着率63%向上・イノベーション指標52%向上。実装ロードマップ付き。', insight:'【要点】役職・職位ではなくスキルを組織設計の基軸にすることで定着率・イノベーション双方が大幅改善する。【実務適用】タレントマネジメント基盤をスキルタクソノミーベースへ移行するロードマップを検討し、まずパイロット部門での試験運用から始める。【注意点】日本の年功序列・職能給制度との整合性確保が最大の課題。' },
      { id:'cap-006', theme:'CAP', title:'Strategic Workforce Planning: From Headcount to Capability Portfolios', titleJa:'戦略的ワークフォース計画：人員数から能力ポートフォリオへ', authors:'Boudreau, J.W. & Ziskin, I.', year:2024, source:'HBR', importance:4, novelty:4, url:'https://hbr.org/2024/strategic-workforce-capability', abstract:'人員数計画から能力ポートフォリオアプローチへの転換を論じる。「仕事の分解」でオートメーション vs 人的能力投資優先度を特定する手法を提示。', insight:'【要点】ワークフォースプランニングは「何人必要か」より「どの能力が必要か」という問いへの転換が急務。【実務適用】サクセッションプランに能力ポートフォリオ視点を統合し、重要ポジションの後継者を「人数」でなく「能力充足率」で管理する仕組みを設計する。【注意点】データ基盤（スキルマップ等）の整備が前提条件となる。' },
      { id:'cap-007', theme:'CAP', title:'HR Technology for Capability Development: AI-Powered Learning Ecosystems', titleJa:'能力開発のためのHRテクノロジー：AI駆動学習エコシステム', authors:'Bersin, J.', year:2025, source:'Gartner', importance:4, novelty:5, url:'https://gartner.com/en/hr/insights/learning-ai-2025', abstract:'Gartner AI搭載LXP市場分析。スキル推論・ギャップ分析・パーソナライズド学習経路生成を統合した能力インテリジェンスプラットフォームを推奨。', insight:'【要点】AIによる個別最適化学習経路生成がLXP市場の標準になりつつある。【実務適用】現行の学習管理システムをAI搭載LXPへの移行可能性を評価し、スキル推論機能とパーソナライズ機能の要件定義を開始する。【注意点】ツール導入前にスキルタクソノミーと能力定義の整備が必須。' },
      { id:'cap-008', theme:'CAP', title:'Peer Learning and Collective Capability Development in Organizations', titleJa:'組織におけるピアラーニングと集合的能力開発', authors:'Boud, D. & Falchikov, N.', year:2024, source:'JAP', importance:4, novelty:4, url:'https://doi.org/10.1037/apl.peer.2024', abstract:'ピアラーニング有効性のエビデンス統合。構造化ピアコーチング・実践コミュニティ・アクションラーニングセットが最高ROIを示す。', insight:'【要点】構造化されたピアラーニングは集合研修と比べコスト対効果が高く、特にリーダーシップ開発で優れた成果を示す。【実務適用】GCSでのサクセッション候補者育成プログラムに「アクションラーニングセット（少人数の実践課題共有グループ）」を組み込み、学習と業務を連動させる。【注意点】ファシリテーターの質がピアラーニングの効果を大きく左右する。' },
      { id:'cap-009', theme:'CAP', title:'日本企業の人材開発実態調査2024', titleJa:'日本企業の人材開発実態調査2024', authors:'産労総合研究所', year:2024, source:'J-STAGE', importance:4, novelty:4, url:'https://www.jstage.jst.go.jp/browse/sanro/2024', abstract:'国内650社の人材開発・能力開発施策の実態を網羅的に調査。リスキリング・70:20:10モデル・管理職開発の動向を詳細に分析。', insight:'【要点】国内企業のリスキリングは投資増加にもかかわらず「研修実施」止まりで行動変容・業績連動まで至っていない企業が多数。【実務適用】能力開発施策の設計時に「研修後90日間の行動変容追跡」を標準プロセスとして組み込み、学習転移を測定可能にする。【注意点】管理職の開発サポート行動（コーチング・フィードバック）が転移の鍵であり、管理職育成と並走が必須。' },
      { id:'cap-010', theme:'CAP', title:'Measuring Capability Development ROI: Beyond Training Hours', titleJa:'能力開発ROIの測定：研修時間を超えて', authors:'Phillips, J.J. & Phillips, P.P.', year:2024, source:'HBR', importance:4, novelty:3, url:'https://hbr.org/2024/measuring-capability-roi', abstract:'現代的能力開発向けROI方法論。ビジネス成果連動モデル・能力移転測定・予測インパクトスコアリングフレームワークを提案。', insight:'【要点】能力開発のROIは「研修時間・満足度」でなく「ビジネス成果への貢献」で測定すべきという方法論が確立されつつある。【実務適用】FY26の能力開発施策にKirkpatrickモデルのLevel 4（ビジネス成果）まで含めた評価設計を導入し、経営層への投資対効果の説明責任を果たす。【注意点】成果測定には開始前のベースライン設定が必要。' },
      // ── SUC ──
      { id:'suc-001', theme:'SUC', title:'CEO Succession and Corporate Performance: A Meta-Analysis', titleJa:'CEO継承と企業業績：メタ分析', authors:'Zhang, Y. & Rajagopalan, N.', year:2024, source:'AMJ', importance:5, novelty:4, url:'https://doi.org/10.5465/amj.succession.2024', abstract:'340件のCEO継承研究のメタ分析。安定環境では内部後継者が外部を上回り、危機時は逆転。サクセッション計画のリードタイムが重要変数。', insight:'【要点】安定期は内部育成後継者が、危機時は外部登用が業績に優れるという環境適合モデルが確立した。【実務適用】サクセッション計画において「平時用パイプライン」と「危機対応用外部登用基準」を並走して整備し、環境変化に応じて切り替えられる二段構えを設計する。【注意点】日本企業は内部昇進偏重が強いため意識的に外部視点を取り込む仕組みが必要。' },
      { id:'suc-002', theme:'SUC', title:'Best Practices in Succession Management: DDI Global Report 2024', titleJa:'サクセッション管理ベストプラクティス：DDIグローバルレポート2024', authors:'DDI Research Institute', year:2024, source:'DDI', importance:5, novelty:4, url:'https://ddiworld.com/research/succession-2024', abstract:'世界2,000名超のHRリーダー調査。強固な後継者パイプラインを持つのは40%のみ。トップ企業は構造化レディネス評価・ストレッチ課題・ボードレベルの可視化を活用。', insight:'【要点】サクセッションの成熟度が高い企業の共通点は「構造化レディネス評価」「意図的ストレッチ配置」「経営層の関与」の3点。【実務適用】現状のサクセッション候補者評価にDDIのReadinessフレームを導入し、「今すぐ就任可能」「1〜2年後」「3〜5年後」の3層で可視化する。【注意点】評価の客観性確保のため複数評価者によるキャリブレーションセッションが必要。' },
      { id:'suc-003', theme:'SUC', title:'Accelerating Leadership Pipelines: From Succession Planning to Succession Management', titleJa:'リーダーシップパイプラインの加速：計画から管理へ', authors:'Charan, R. & Drotter, S.', year:2025, source:'HBR', importance:5, novelty:4, url:'https://hbr.org/2025/leadership-pipeline', abstract:'ハイブリッド時代向けLeadership Pipelineモデル更新。6つのリーダーシップ通過点と主要トランジションを特定。静的サクセッション図に代わるリアルタイムレディネス追跡を重視。', insight:'【要点】年1回のサクセッション見直しでは時代遅れで、リアルタイムのパイプライン可視化が競争優位の源泉になる。【実務適用】タレントレビューをリアルタイムダッシュボード化し、四半期ごとのパイプライン健全性チェックを経営会議のアジェンダに組み込む。【注意点】ハイブリッド環境での観察機会減少を補うため、定期的な1on1と360フィードバックの頻度を高める必要がある。' },
      { id:'suc-004', theme:'SUC', title:'Talent Analytics for Succession: Using People Data to Predict Leadership Potential', titleJa:'後継者育成のためのタレント分析：ピープルデータでリーダーシップポテンシャルを予測', authors:'Green, D.', year:2025, source:'Gartner', importance:5, novelty:5, url:'https://gartner.com/en/hr/succession-analytics-2025', abstract:'リーディング企業のサクセッション予測分析活用事例。パフォーマンス・アセスメント・360度データを組み合わせたMLモデルが従来手法を大幅に上回る。', insight:'【要点】複数データソースを組み合わせたMLモデルによる後継者ポテンシャル予測が従来の主観的判断を大幅に上回る精度を示す。【実務適用】現在の後継者評価プロセスにデータドリブンな要素（パフォーマンス傾向・アセスメントスコア・360度結果の統合分析）を導入する。【注意点】データの質・量が不十分な場合はモデルの信頼性が低下するため、データ基盤整備が先決。' },
      { id:'suc-005', theme:'SUC', title:'Inclusive Succession Planning: Removing Bias from High-Potential Identification', titleJa:'インクルーシブなサクセッション計画：ハイポテンシャル特定のバイアス除去', authors:'Thomas, R.J. & Cheese, P.', year:2025, source:'AMJ', importance:5, novelty:5, url:'https://doi.org/10.5465/amj.inclusive.2025', abstract:'サクセッション判断における5つの認知バイアスとエビデンスに基づく対策を特定。構造化キャリブレーションとブラインド評価がパイプラインの多様性を有意に向上。', insight:'【要点】サクセッション判断における類似性バイアス・確証バイアス等5つのバイアスが多様性あるパイプライン構築を阻害している。【実務適用】タレントレビュー会議に「ブラインドノミネーション（推薦者氏名隠匿）」と「構造化キャリブレーション基準」を導入し、評価の客観性を高める。【注意点】バイアス除去は一度の研修では不十分で継続的な仕組みとして定着させる必要がある。' },
      { id:'suc-006', theme:'SUC', title:'Board-Level Succession Planning: Governance Best Practices', titleJa:'取締役会レベルのサクセッション計画：ガバナンスのベストプラクティス', authors:'Larcker, D.F. & Miles, S.A.', year:2024, source:'McKinsey', importance:4, novelty:4, url:'https://mckinsey.com/capabilities/strategy-corporate-finance/board-succession', abstract:'200社の取締役会調査。構造化CEOサクセッションプロセスを持つ企業は5年間で株主総利回りが15%高い。主要プラクティスとガバナンスフレームワーク詳述。', insight:'【要点】CEO後継者計画の構造化が5年間で15%の株主価値創出と連動するという強力な財務的根拠が示された。【実務適用】サクセッション計画の重要性を経営層に訴求する際にこのデータを活用し、取締役会レベルでの議論を促進するための情報提供資料を整備する。【注意点】取締役会との連携にはコーポレートガバナンス担当部門との協働が必要。' },
      { id:'suc-007', theme:'SUC', title:'日本企業における後継者育成の課題と解決策', titleJa:'日本企業における後継者育成の課題と解決策', authors:'守島基博', year:2024, source:'J-STAGE', importance:5, novelty:4, url:'https://www.jstage.jst.go.jp/browse/hrmj/succession', abstract:'日本的雇用慣行とサクセッション計画の整合性を分析。年功序列からポテンシャル重視への移行における組織文化的障壁と介入策を提示。', insight:'【要点】年功序列文化のもとではサクセッション計画がポテンシャル評価ではなく「順番待ちリスト」になりやすい構造的問題がある。【実務適用】ポテンシャル評価基準を明文化・可視化し、年齢・年次と切り離した昇格・配置の意思決定ガイドラインを整備する。【注意点】制度変更だけでは不十分で、評価者のマインドセット変革（バイアス認識・コーチング型フィードバック）への投資が不可欠。' },
      { id:'suc-008', theme:'SUC', title:'Stretch Assignments and Leadership Development: Evidence from 10-Year Study', titleJa:'ストレッチ課題とリーダーシップ開発：10年間の研究から', authors:'McCauley, C.D. & Brutus, S.', year:2024, source:'JAP', importance:4, novelty:3, url:'https://doi.org/10.1037/apl.stretch.2024', abstract:'縦断研究によるストレッチ課題の有効性確認。不慣れな責任・権限なしのマネジメント・高い可視性が最も開発効果の高い課題特性と判明。', insight:'【要点】「不慣れな責任」「権限なしのマネジメント」「高い可視性」の3つがリーダーシップ開発に最も効くストレッチ課題の特性。【実務適用】後継者候補のIDP（個人開発計画）にこの3要素を満たすアサインメントを意図的に組み込み、上司がコーチとして伴走する構造を設計する。【注意点】ストレッチが強すぎると離職リスクが高まるため、心理的安全性の確保と適切なサポート体制が必須。' },
      { id:'suc-009', theme:'SUC', title:'Executive Coaching ROI in Succession Development Programs', titleJa:'サクセッション育成プログラムにおけるエグゼクティブコーチングROI', authors:'Grant, A.M. & Cavanagh, M.J.', year:2024, source:'OrgSci', importance:4, novelty:4, url:'https://doi.org/10.1287/orsc.coaching.2024', abstract:'サクセッションプログラムにおけるエグゼクティブコーチングの体系的レビュー。ビジネス成果とサクセッション基準に紐づいたコーチングはROI 5.7倍。', insight:'【要点】コーチングをビジネス成果とサクセッション基準に明確に紐づけると、目的不明確なコーチングの5.7倍のROIを示す。【実務適用】コーチング契約前に「このコーチングで何のサクセッション基準を強化するか」を明確にし、開始・中間・終了の3点でビジネス成果測定を組み込む。【注意点】コーチの質と相性が成果に大きく影響するためコーチ選定プロセスの標準化が重要。' },
      { id:'suc-010', theme:'SUC', title:'Succession Risk Assessment: Quantifying Leadership Pipeline Gaps', titleJa:'サクセッションリスク評価：リーダーシップパイプラインギャップの定量化', authors:'Ulrich, D. & Smallwood, N.', year:2025, source:'DDI', importance:5, novelty:5, url:'https://ddiworld.com/research/risk-assessment-2025', abstract:'役割の重要性×パイプライン深度×レディネス速度でサクセッションリスクを定量化する新フレームワーク。財務指標を用いたボードレベルのタレントリスク議論を可能にする。', insight:'【要点】サクセッションリスクを「役割重要性×パイプライン深度×レディネス速度」で定量化することで取締役会レベルの議論が可能になる。【実務適用】重要ポジションをリスクマトリクスで可視化し、リスクの高いポジション（重要度高×後継者少×育成遅）を最優先の育成投資対象として経営会議に提示する。【注意点】定量化は判断を補助するものであり、最終判断は定性的な文脈理解を含む人間が行う必要がある。' },
      // ── REP ──
      { id:'rep-001', theme:'REP', title:'Global Talent Trends 2025: The Era of Human Magic', titleJa:'グローバルタレントトレンド2025：ヒューマンマジックの時代', authors:'Mercer', year:2025, source:'McKinsey', importance:5, novelty:5, url:'https://mercer.com/our-thinking/career/global-talent-hr-trends.html', abstract:'12,000名超のHRリーダーへの年次調査。スキルファーストタレントモデル・AI-人間チーミング・ウェルビーイングの生産性ドライバー化・社会契約再設計がトップテーマ。', insight:'【要点】2025年のHRの最重要テーマは「AIと人間の協働設計」「スキルベースのタレントモデル」「ウェルビーイングの生産性投資化」の3点。【実務適用】FY26のGCS活動計画にこれら3テーマを参照軸として組み込み、組織能力開発PJの方向性と整合させる。【注意点】グローバルトレンドと日本固有課題（例：心理的安全性・エンゲージメント）のギャップを意識した解釈が必要。' },
      { id:'rep-002', theme:'REP', title:'State of the Global Workplace 2025', titleJa:'グローバル職場環境レポート2025', authors:'Gallup', year:2025, source:'Gartner', importance:5, novelty:5, url:'https://gallup.com/workplace/349484/state-of-the-global-workplace.aspx', abstract:'160カ国のエンゲージメント調査。エンゲージメント23%で停滞。マネジャーの質が第1ドライバー。OD投資の強力なビジネスケースを提示。', insight:'【要点】世界のエンゲージメントが23%で停滞し、最大の規定因はマネジャーの質であることが再確認された。【実務適用】組織開発投資のビジネスケース構築にGallupのエンゲージメント-業績連動データを活用し、マネジャー育成への投資優先度引き上げを経営層に提案する根拠として使用する。【注意点】日本のエンゲージメント水準は世界最低水準に近いため、グローバル平均との比較ではなく日本内の改善トレンドに着目することが重要。' },
      { id:'rep-003', theme:'REP', title:'Future of Jobs Report 2025', titleJa:'雇用の未来レポート2025', authors:'World Economic Forum', year:2025, source:'McKinsey', importance:5, novelty:5, url:'https://weforum.org/reports/the-future-of-jobs-report-2025', abstract:'WEF予測：2027年までに8,500万の職が代替され9,700万の新職種が生まれる。分析的思考・創造性・レジリエンスがトップスキル需要。大規模リスキリングが急務。', insight:'【要点】2027年までに既存業務の大規模代替が起き、分析的思考・創造性・レジリエンスが最重要スキルになる。【実務適用】GLOBISの人材開発戦略においてこれら3スキルをコアコンピテンシーとして再定義し、育成プログラムと評価基準のアップデートを検討する。【注意点】職種消滅と新職種創出は同時進行するため「リスキリング」ではなく「スキルの継続的更新」という発想への転換が重要。' },
      { id:'rep-004', theme:'REP', title:'Human Capital Management Excellence Report 2025', titleJa:'人的資本管理エクセレンスレポート2025', authors:'Brandon Hall Group', year:2025, source:'DDI', importance:4, novelty:4, url:'https://brandonhall.com/hcm-excellence-2025', abstract:'1,000組織のHCMプラクティス比較。ベストインクラス企業はサクセッション・能力開発・パフォーマンス管理を単一タレントエコシステムに統合。', insight:'【要点】ベストインクラス企業はサクセッション・能力開発・パフォーマンス管理を分断せず単一エコシステムとして統合運用している。【実務適用】GCSの3専門領域（OD・能力開発・サクセッション）を統合的に提供できるサービスモデルを設計し、分断した施策提供から脱却する。【注意点】統合には各制度・システムの整合性確保が必要で段階的なロードマップが現実的。' },
      { id:'rep-005', theme:'REP', title:'Japan HR Tech Landscape 2025', titleJa:'日本HRテックランドスケープ2025', authors:'HR総研', year:2025, source:'J-STAGE', importance:4, novelty:5, url:'https://hrpro.co.jp/hr-tech-landscape-2025', abstract:'国内HRテック市場最新動向。タレントマネジメント・サクセッション・組織診断の各カテゴリーの製品比較と導入事例を網羅。', insight:'【要点】国内HRテック市場でタレントマネジメント・サクセッション・組織診断の統合プラットフォームへの需要が急増している。【実務適用】GLOBISのHRシステム戦略立案時にこのレポートを参照し、特にサクセッション管理と組織診断のデジタル化優先度を検討する材料として活用する。【注意点】製品比較は導入時点の情報であり、継続的なベンダー評価が必要。' }
    ]
  };
}

const SOURCE_LABELS = { AMJ:'Academy of Management Journal', JAP:'Journal of Applied Psychology', OrgSci:'Organization Science', HBR:'Harvard Business Review', McKinsey:'McKinsey', DDI:'DDI', Gartner:'Gartner', Deloitte:'Deloitte', 'J-STAGE':'J-STAGE' };
const THEME_LABELS = { OD:'OD', CAP:'組織能力開発', SUC:'サクセッション', REP:'実務レポート' };

function render() {
  const papers = state.data?.papers || [];
  const counts = { all:papers.length, OD:0, CAP:0, SUC:0, REP:0 };
  papers.forEach(p => counts[p.theme] = (counts[p.theme]||0) + 1);
  ['all','OD','CAP','SUC','REP'].forEach(k => { document.getElementById('cnt-'+k).textContent = counts[k] || 0; });
  document.getElementById('statTotal').textContent = papers.length;
  document.getElementById('statHigh').textContent = papers.filter(p => p.importance === 5).length;
  document.getElementById('statNew').textContent = papers.filter(p => p.year >= 2025).length;
  if (state.data?.updatedAt) {
    const d = new Date(state.data.updatedAt);
    const ds = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
    document.getElementById('statUpdated').textContent = ds;
    document.getElementById('lastUpdatedBar').textContent = `最終更新：${ds} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  renderCards();
}

function renderCards() {
  const grid = document.getElementById('papersGrid');
  const list = filteredList();
  if (!list.length) { grid.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>該当する論文・レポートがありません。<br>フィルターを変更してください。</p></div>`; return; }
  grid.innerHTML = list.map(p => cardHtml(p)).join('');
}

function filteredList() {
  return (state.data?.papers || []).filter(p => {
    if (state.tab !== 'all' && p.theme !== state.tab) return false;
    if (state.fi && p.importance < +state.fi) return false;
    if (state.fn && p.novelty < +state.fn) return false;
    if (state.fy) { const yr = +state.fy; if (yr === 2023 && p.year >= 2024) return false; if (yr > 2023 && p.year !== yr) return false; }
    if (state.fs && p.source !== state.fs) return false;
    return true;
  });
}

function stars(n, type) {
  let h = '';
  for (let i = 1; i <= 5; i++) { h += `<span class="star ${i<=n ? type+' filled' : 'empty'}">${type==='imp'?'★':'✦'}</span>`; }
  return h;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function cardHtml(p) {
  return `<div class="paper-card">
  <div class="card-header">
    <span class="theme-tag theme-${esc(p.theme)}">${esc(THEME_LABELS[p.theme]||p.theme)}</span>
    <div class="scores">
      <div class="score-row"><span class="score-label">重要</span><div class="stars">${stars(p.importance,'imp')}</div></div>
      <div class="score-row"><span class="score-label">新規</span><div class="stars">${stars(p.novelty,'nov')}</div></div>
    </div>
  </div>
  <div class="paper-title">${esc(p.title)}</div>
  ${p.title !== p.titleJa ? `<div class="paper-title-ja">${esc(p.titleJa)}</div>` : ''}
  <div class="paper-meta">
    <span class="meta-item">✍️ ${esc(p.authors)}</span>
    <span class="meta-item">📅 ${esc(String(p.year))}</span>
    <span class="source-badge">${esc(SOURCE_LABELS[p.source]||p.source)}</span>
  </div>
  <div class="card-footer">
    <a class="url-link" href="${esc(p.url)}" target="_blank" onclick="event.stopPropagation()">🔗 出典を開く</a>
    <button class="ai-btn" id="aibtn-${esc(p.id)}" onclick="toggleAI('${esc(p.id)}',this)">✨ 実務示唆</button>
  </div>
  <div class="ai-panel" id="ai-${esc(p.id)}">
    <div class="ai-panel-title" id="ait-${esc(p.id)}">📄 概要・実務示唆</div>
    <div class="ai-panel-content" id="aic-${esc(p.id)}"></div>
  </div>
</div>`;
}

function switchTab(t) { state.tab = t; document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === t)); renderCards(); }
function applyFilters() { state.fi = document.getElementById('filterImportance').value; state.fn = document.getElementById('filterNovelty').value; state.fy = document.getElementById('filterYear').value; state.fs = document.getElementById('filterSource').value; renderCards(); }

const aiCache = {};
function buildStaticInsight(paper) {
  const base = paper.insight || paper.abstract || '';
  return `${base}\n\n出典：${paper.authors}（${paper.year}年）${SOURCE_LABELS[paper.source]||paper.source}`;
}

async function toggleAI(id, btn) {
  const panel = document.getElementById('ai-'+id), content = document.getElementById('aic-'+id);
  if (panel.classList.contains('visible')) { panel.classList.remove('visible'); btn.classList.remove('active'); btn.textContent = '✨ 実務示唆'; return; }
  panel.classList.add('visible'); btn.classList.add('active'); btn.textContent = '▲ 閉じる';
  if (aiCache[id]) { content.textContent = aiCache[id]; return; }
  const paper = (state.data?.papers||[]).find(p => p.id === id);
  if (!paper) return;
  const titleEl = document.getElementById('ait-'+id);
  if (paper.insight || paper.abstract) {
    const t = buildStaticInsight(paper); aiCache[id] = t; content.textContent = t;
    if (titleEl) titleEl.textContent = '📄 概要・実務示唆';
    return;
  }
  if (typeof window.cowork !== 'undefined' && window.cowork?.askClaude) {
    if (titleEl) titleEl.textContent = '🤖 AIによる実務示唆（生成中…）';
    content.innerHTML = `<div class="ai-loading"><div class="ai-spinner"></div>AIが分析中...</div>`;
    try {
      const result = await window.cowork.askClaude(`OD実践者向けに以下の論文の実務示唆を日本語200字で。\nタイトル: ${paper.title}\n著者: ${paper.authors}（${paper.year}）\n概要: ${paper.abstract}\n形式：【要点】〜。【実務適用】〜。【注意点】〜。`);
      aiCache[id] = result; content.textContent = result;
      if (titleEl) titleEl.textContent = '🤖 AIによる実務示唆';
    } catch(e) { const f = buildStaticInsight(paper); aiCache[id] = f; content.textContent = f; }
  }
}

async function triggerUpdate() {
  const btn = document.getElementById('updateBtn'); btn.classList.add('loading'); btn.disabled = true;
  await new Promise(r => setTimeout(r, 1200));
  alert('週次スケジュールタスクが設定済みです。\n次回の自動更新：毎週月曜 朝8:00');
  btn.classList.remove('loading'); btn.disabled = false;
}
</script>
