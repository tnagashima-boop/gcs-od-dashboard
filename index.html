<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>論文・学術研究専門ダッシュボード</title>
<style>
:root {
  color-scheme: light;
  --primary: #1a56db;
  --primary-light: #e8f0fe;
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --text-muted: #64748b;
  --tag-od: #dbeafe;
  --tag-od-text: #1d4ed8;
  --tag-cap: #dcfce7;
  --tag-cap-text: #15803d;
  --tag-suc: #fef3c7;
  --tag-suc-text: #92400e;
  --tag-rep: #f3e8ff;
  --tag-rep-text: #7c3aed;
  --star-filled: #f59e0b;
  --novel-filled: #10b981;
  --star-empty: #d1d5db;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.header {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.header-left h1 { font-size: 17px; font-weight: 700; }
.header-left .subtitle { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.update-btn {
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: opacity 0.2s;
}
.update-btn:hover { opacity: 0.85; }
.update-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.spinner {
  width: 13px; height: 13px;
  border: 2px solid rgba(255,255,255,0.35);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: none;
}
.update-btn.loading .spinner { display: block; }
.update-btn.loading .btn-text { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.tabs {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  display: flex;
  overflow-x: auto;
}
.tab {
  padding: 11px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  transition: all 0.15s;
  user-select: none;
}
.tab:hover { color: var(--primary); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }
.tab .cnt {
  background: var(--primary-light);
  color: var(--primary);
  border-radius: 10px;
  padding: 1px 6px;
  font-size: 10px;
  margin-left: 5px;
}

.filters {
  padding: 10px 20px;
  background: white;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
select {
  font-size: 12px;
  padding: 5px 9px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: white;
  color: var(--text);
  cursor: pointer;
}

.content { padding: 16px 20px; }

.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.stat-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  text-align: center;
}
.stat-card .num { font-size: 26px; font-weight: 800; color: var(--primary); }
.stat-card .lbl { font-size: 10px; color: var(--text-muted); margin-top: 3px; }

.papers-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: 12px;
}

.paper-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  transition: box-shadow 0.2s, transform 0.15s;
}
.paper-card:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.09); transform: translateY(-1px); }

.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 9px;
}
.theme-tag {
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
}
.theme-OD  { background: var(--tag-od);  color: var(--tag-od-text); }
.theme-CAP { background: var(--tag-cap); color: var(--tag-cap-text); }
.theme-SUC { background: var(--tag-suc); color: var(--tag-suc-text); }
.theme-REP { background: var(--tag-rep); color: var(--tag-rep-text); }

.scores { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; flex-shrink: 0; }
.score-row { display: flex; align-items: center; gap: 4px; }
.score-label { font-size: 9px; color: var(--text-muted); width: 22px; text-align: right; }
.stars { display: flex; gap: 1px; }
.star { font-size: 11px; line-height: 1; }
.star.imp.filled { color: var(--star-filled); }
.star.nov.filled { color: var(--novel-filled); }
.star.empty { color: var(--star-empty); }

.paper-title { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.4; margin-bottom: 4px; }
.paper-title-ja { font-size: 11px; color: var(--text-muted); margin-bottom: 7px; line-height: 1.4; font-style: italic; }
.paper-meta { display: flex; flex-wrap: wrap; gap: 5px; font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
.meta-item { display: flex; align-items: center; gap: 3px; }
.source-badge { background: #f1f5f9; border-radius: 4px; padding: 2px 6px; font-size: 10px; font-weight: 600; color: #475569; }

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 9px;
  padding-top: 9px;
  border-top: 1px solid var(--border);
}
.url-link { font-size: 11px; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 3px; }
.url-link:hover { text-decoration: underline; }
.ai-btn {
  background: var(--primary-light);
  color: var(--primary);
  border: none;
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: background 0.15s;
}
.ai-btn:hover { background: #c7d7fe; }
.ai-btn.active { background: var(--primary); color: white; }

.ai-panel {
  margin-top: 10px;
  padding: 11px;
  background: linear-gradient(135deg, #f0f7ff 0%, #f5f0ff 100%);
  border-radius: 8px;
  border-left: 3px solid var(--primary);
  display: none;
}
.ai-panel.visible { display: block; }
.ai-panel-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 7px;
}
.ai-panel-content {
  font-size: 12px;
  line-height: 1.75;
  color: var(--text);
  white-space: pre-wrap;
}
.ai-loading { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
.ai-spinner {
  width: 13px; height: 13px;
  border: 2px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); grid-column: 1/-1; }
.empty-state .icon { font-size: 40px; margin-bottom: 10px; }
.empty-state p { font-size: 13px; }
.last-updated { font-size: 11px; color: var(--text-muted); text-align: center; padding: 14px; }

@media (max-width: 600px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .papers-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>📚 論文・学術研究専門ダッシュボード</h1>
    <div class="subtitle">OD / 組織能力開発 / サクセッション計画 — 研究インテリジェンス for GCS</div>
  </div>
  <button class="update-btn" id="updateBtn" onclick="triggerUpdate()">
    <div class="spinner"></div>
    <span class="btn-text">🔄 今すぐ更新</span>
  </button>
</div>

<div class="tabs">
  <div class="tab active" data-tab="all"    onclick="switchTab('all')">すべて <span class="cnt" id="cnt-all">0</span></div>
  <div class="tab"        data-tab="OD"     onclick="switchTab('OD')">組織開発 (OD) <span class="cnt" id="cnt-OD">0</span></div>
  <div class="tab"        data-tab="CAP"    onclick="switchTab('CAP')">組織能力開発 <span class="cnt" id="cnt-CAP">0</span></div>
  <div class="tab"        data-tab="SUC"    onclick="switchTab('SUC')">サクセッション <span class="cnt" id="cnt-SUC">0</span></div>
  <div class="tab"        data-tab="REP"    onclick="switchTab('REP')">実務レポート <span class="cnt" id="cnt-REP">0</span></div>
</div>

<div class="filters">
  <span class="filter-label">絞り込み：</span>
  <select id="filterImportance" onchange="applyFilters()">
    <option value="">重要度：すべて</option>
    <option value="5">★★★★★ のみ</option>
    <option value="4">★★★★☆ 以上</option>
    <option value="3">★★★☆☆ 以上</option>
  </select>
  <select id="filterNovelty" onchange="applyFilters()">
    <option value="">新規性：すべて</option>
    <option value="5">✦✦✦✦✦ のみ</option>
    <option value="4">✦✦✦✦◇ 以上</option>
    <option value="3">✦✦✦◇◇ 以上</option>
  </select>
  <select id="filterYear" onchange="applyFilters()">
    <option value="">発行年：すべて</option>
    <option value="2026">2026年</option>
    <option value="2025">2025年</option>
    <option value="2024">2024年</option>
    <option value="2023">2023年以前</option>
  </select>
  <select id="filterSource" onchange="applyFilters()">
    <option value="">情報源：すべて</option>
    <option value="AMJ">Academy of Management Journal</option>
    <option value="JAP">Journal of Applied Psychology</option>
    <option value="OrgSci">Organization Science</option>
    <option value="HBR">Harvard Business Review</option>
    <option value="McKinsey">McKinsey</option>
    <option value="DDI">DDI</option>
    <option value="Gartner">Gartner</option>
    <option value="Deloitte">Deloitte</option>
    <option value="J-STAGE">J-STAGE</option>
  </select>
</div>

<div class="content">
  <div class="stats-row">
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lbl">総論文・レポート数</div></div>
    <div class="stat-card"><div class="num" id="statHigh">0</div><div class="lbl">重要度 ★★★★★</div></div>
    <div class="stat-card"><div class="num" id="statNew">0</div><div class="lbl">2025年以降の新着</div></div>
    <div class="stat-card"><div class="num" id="statUpdated">―</div><div class="lbl">最終更新日</div></div>
  </div>
  <div class="papers-grid" id="papersGrid"></div>
  <div class="last-updated" id="lastUpdatedBar"></div>
</div>

window.addEventListener('DOMContentLoaded', () => {
  const raw = localStorage.getItem(STORAGE_KEY);

  render();
});

      { id:'od-006', theme:'OD',  title:'Whole System Change: Integrating Large Group Methods with Strategic Planning',

// ── Source label map ─────────────────────────────────────────
const SOURCE_LABELS = {
  AMJ:'Academy of Management Journal', JAP:'Journal of Applied Psychology',
  OrgSci:'Organization Science', HBR:'Harvard Business Review',
  McKinsey:'McKinsey', DDI:'DDI', Gartner:'Gartner',
  Deloitte:'Deloitte', 'J-STAGE':'J-STAGE'
};
const THEME_LABELS = { OD:'OD', CAP:'組織能力開発', SUC:'サクセッション', REP:'実務レポート' };

// ── Render ───────────────────────────────────────────────────
function render() {
  const papers = state.data?.papers || [];

  const counts = { all:papers.length, OD:0, CAP:0, SUC:0, REP:0 };
  papers.forEach(p => counts[p.theme] = (counts[p.theme]||0) + 1);
  ['all','OD','CAP','SUC','REP'].forEach(k => {
    document.getElementById('cnt-'+k).textContent = counts[k] || 0;
  });

  document.getElementById('statTotal').textContent = papers.length;
  document.getElementById('statHigh').textContent  = papers.filter(p => p.importance === 5).length;
  document.getElementById('statNew').textContent   = papers.filter(p => p.year >= 2025).length;

  if (state.data?.updatedAt) {
    const d  = new Date(state.data.updatedAt);
    const ds = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
    document.getElementById('statUpdated').textContent  = ds;
    document.getElementById('lastUpdatedBar').textContent = `最終更新：${ds} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  renderCards();
}

function renderCards() {
  const grid = document.getElementById('papersGrid');
  const list = filteredList();
  if (!list.length) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>該当する論文・レポートがありません。<br>フィルターを変更してください。</p></div>`;
    return;
  }
  grid.innerHTML = list.map(p => cardHtml(p)).join('');
}

function filteredList() {
  return (state.data?.papers || []).filter(p => {
    if (state.tab !== 'all' && p.theme !== state.tab) return false;
    if (state.fi && p.importance < +state.fi) return false;
    if (state.fn && p.novelty    < +state.fn) return false;
    if (state.fy) {
      const yr = +state.fy;
      if (yr === 2023 && p.year >= 2024)  return false;
      if (yr >  2023 && p.year !== yr)    return false;
    }
    if (state.fs && p.source !== state.fs) return false;
    return true;
  });
}

function stars(n, type) {
  let h = '';
  for (let i = 1; i <= 5; i++) {
    const filled = i <= n;
    const cls = filled ? `star ${type} filled` : 'star empty';
    const ch  = type === 'imp' ? '★' : '✦';
    h += `<span class="${cls}">${ch}</span>`;
  }
  return h;
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function cardHtml(p) {
  const isDiff = p.title !== p.titleJa;
  return `
<div class="paper-card">
  <div class="card-header">
    <span class="theme-tag theme-${esc(p.theme)}">${esc(THEME_LABELS[p.theme]||p.theme)}</span>
    <div class="scores">
      <div class="score-row"><span class="score-label">重要</span><div class="stars">${stars(p.importance,'imp')}</div></div>
      <div class="score-row"><span class="score-label">新規</span><div class="stars">${stars(p.novelty,'nov')}</div></div>
    </div>
  </div>
  <div class="paper-title">${esc(p.title)}</div>
  ${isDiff ? `<div class="paper-title-ja">${esc(p.titleJa)}</div>` : ''}
  <div class="paper-meta">
    <span class="meta-item">✍️ ${esc(p.authors)}</span>
    <span class="meta-item">📅 ${esc(String(p.year))}</span>
    <span class="source-badge">${esc(SOURCE_LABELS[p.source]||p.source)}</span>
  </div>
  <div class="card-footer">
    <a class="url-link" href="${esc(p.url)}" target="_blank" onclick="event.stopPropagation()">🔗 出典を開く</a>
    <button class="ai-btn" id="aibtn-${esc(p.id)}" onclick="toggleAI('${esc(p.id)}',this)">✨ 実務示唆</button>
  </div>
  <div class="ai-panel" id="ai-${esc(p.id)}">
    <div class="ai-panel-title" id="ait-${esc(p.id)}">📄 概要・実務示唆</div>
    <div class="ai-panel-content" id="aic-${esc(p.id)}"></div>
  </div>
</div>`;
}

// ── Tab / filter ─────────────────────────────────────────────
function switchTab(t) {
  state.tab = t;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === t));
  renderCards();
}
function applyFilters() {
  state.fi = document.getElementById('filterImportance').value;
  state.fn = document.getElementById('filterNovelty').value;
  state.fy = document.getElementById('filterYear').value;
  state.fs = document.getElementById('filterSource').value;
  renderCards();
}

// ── AI explanation ────────────────────────────────────────────
const aiCache = {};

// insight フィールドまたは abstract から実務示唆テキストを生成
function buildStaticInsight(paper) {
  const base = paper.insight || paper.abstract || '';
  return `【概要・実務示唆】\n${base}\n\n出典：${paper.authors}（${paper.year}年）${SOURCE_LABELS[paper.source]||paper.source}`;
}

async function toggleAI(id, btn) {
  const panel   = document.getElementById('ai-'+id);
  const content = document.getElementById('aic-'+id);
  const open    = panel.classList.contains('visible');
  if (open) { panel.classList.remove('visible'); btn.classList.remove('active'); btn.textContent = '✨ 実務示唆'; return; }

  panel.classList.add('visible');
  btn.classList.add('active');
  btn.textContent = '▲ 閉じる';

  if (aiCache[id]) { content.textContent = aiCache[id]; return; }

  const paper = (state.data?.papers||[]).find(p => p.id === id);
  if (!paper) return;

  const titleEl = document.getElementById('ait-'+id);

  // ── paper に insight フィールドがある場合は即時表示 ──
  if (paper.insight) {
    const text = buildStaticInsight(paper);
    aiCache[id] = text;
    content.textContent = text;
    if (titleEl) titleEl.textContent = '📄 概要・実務示唆';
    return;
  }

  // ── Cowork アーティファクト環境では askClaude でリッチな示唆を生成 ──
  if (typeof window.cowork !== 'undefined' && window.cowork?.askClaude) {
    if (titleEl) titleEl.textContent = '🤖 AIによる実務示唆（生成中…）';
    content.innerHTML = `<div class="ai-loading"><div class="ai-spinner"></div>AIが分析中...</div>`;
    try {
      const prompt = `あなたはOD（組織開発）・組織能力開発・タレントマネジメントの専門家です。
以下の研究論文・レポートについて、OD実践者向けの実務示唆を日本語で答えてください。

タイトル: ${paper.title}
著者: ${paper.authors}（${paper.year}年）
情報源: ${SOURCE_LABELS[paper.source]||paper.source}
内容概要: ${paper.abstract}

以下の形式で簡潔に回答してください（合計200字程度）：
【要点】この研究の核心的な発見を1〜2文で。
【実務適用】組織開発・能力開発・サクセッション実践に活かせる具体的アクションを1〜2つ。
【注意点】日本企業での適用時に考慮すべきことを1文で。`;
      const result = await window.cowork.askClaude(prompt);
      aiCache[id] = result;
      content.textContent = result;
      if (titleEl) titleEl.textContent = '🤖 AIによる実務示唆（OD実践者向け）';
    } catch(e) {
      // askClaude が失敗した場合も abstract にフォールバック
      const fallback = buildStaticInsight(paper);
      aiCache[id] = fallback;
      content.textContent = fallback;
      if (titleEl) titleEl.textContent = '📄 概要・実務示唆';
    }
  } else {
    // ── 通常 HTML ファイルとして開いた場合：abstract を実務示唆として表示 ──
    const fallback = buildStaticInsight(paper);
    aiCache[id] = fallback;
    content.textContent = fallback;
    if (titleEl) titleEl.textContent = '📄 概要・実務示唆';
  }
}

// ── Update trigger ────────────────────────────────────────────
async function triggerUpdate() {
  const btn = document.getElementById('updateBtn');
  btn.classList.add('loading');
  btn.disabled = true;

  try {
    const taskId = localStorage.getItem(TASK_KEY);
    if (taskId && window.cowork?.runScheduledTask) {
      await window.cowork.runScheduledTask(taskId);
      await new Promise(r => setTimeout(r, 3500));
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { state.data = JSON.parse(raw); render(); }
    } else {
      await new Promise(r => setTimeout(r, 1200));
      alert('週次スケジュールタスクが設定済みです。\n次回の自動更新：毎週月曜 朝8:00');
    }
  } catch(e) {
    console.error(e);
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}
